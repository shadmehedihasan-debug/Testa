<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store help assistant</title>
<style>
:root{
  --page:#e9ede9; --panel:#fff; --side:#1f2a30; --side-ink:#e8eeea; --side-mute:#9fb0a8;
  --ink:#1f2a30; --mute:#63726b; --line:#d9e0db; --bot:#f1f4f1; --accent:#9a5b22; --accent-2:#7d4817; --on-accent:#fff; --meter:#c9d3cd;
}
@media (prefers-color-scheme:dark){:root{
  --page:#0f1412; --panel:#161d1a; --side:#0b100e; --side-ink:#e3ebe6; --side-mute:#8a9b93;
  --ink:#e3ebe6; --mute:#8fa097; --line:#26312c; --bot:#1d2622; --accent:#c98a4b; --accent-2:#e0a466; --on-accent:#14100a; --meter:#33413a;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100%;max-width:1120px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;background:var(--panel);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:28px 22px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand h1{font:600 1.6rem/1.15 Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 8px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--side-mute);font-size:.9rem}
.topics{display:flex;flex-direction:column;gap:16px;flex:1}
.topic h2{margin:0 0 6px;font-size:.92rem;font-weight:650;color:var(--side-ink)}
.topic button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid #34443d;padding:5px 0 5px 12px;
  color:var(--side-mute);font-size:.9rem}
.topic button:hover{color:var(--side-ink);border-left-color:var(--accent)}
.side-actions{display:flex;gap:8px}
.side-actions button{flex:1;background:none;border:1px solid #34443d;border-radius:6px;padding:7px 8px;font-size:.82rem;color:var(--side-mute)}
.side-actions button:hover{color:var(--side-ink);border-color:var(--side-mute)}
.menu{display:none}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar strong{font-weight:650}
.bar span{color:var(--mute);font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;max-width:100%}
.row.me{justify-content:flex-end}
.av{flex:none;width:32px;height:32px;border-radius:8px;background:var(--side);color:var(--side-ink);display:grid;place-items:center;font:600 .95rem Georgia,serif}
.bubble{max-width:min(620px,86%);padding:11px 15px;border-radius:12px;overflow-wrap:anywhere}
.bot .bubble{background:var(--bot);border-top-left-radius:3px}
.me .bubble{background:var(--accent);color:var(--on-accent);border-top-right-radius:3px}
.src{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:.8rem;color:var(--mute)}
.src .t{display:block;margin-bottom:6px}
.meter{height:4px;border-radius:2px;background:var(--meter);overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.fb{display:flex;align-items:center;gap:6px}
.fb button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:.78rem;color:var(--mute)}
.fb button:hover:not([disabled]){border-color:var(--accent);color:var(--accent-2)}
.fb button.on{border-color:var(--accent);color:var(--accent-2);font-weight:600}
.fb button[disabled]{cursor:default}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--mute);opacity:.6}
@media (prefers-reduced-motion:no-preference){.dots i{animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{50%{transform:translateY(-3px);opacity:1}} #log{scroll-behavior:smooth}}
form{display:flex;gap:10px;padding:14px 28px 20px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.send{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:0 22px;font-weight:650}
.send:hover{background:var(--accent-2)}
.note{margin:0;padding:0 28px 12px;font-size:.76rem;color:var(--mute)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;border:0}
  .side{padding:14px 16px;gap:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;overflow:visible}
  .brand h1{font-size:1.15rem;margin:0}.brand p{display:none}
  .menu{display:block;background:none;border:1px solid #34443d;border-radius:6px;padding:6px 12px;font-size:.85rem;color:var(--side-ink)}
  .topics,.side-actions{display:none;width:100%;margin-top:14px}
  .side.open .topics{display:flex}.side.open .side-actions{display:flex}
  .bar,#log,form,.note{padding-left:16px;padding-right:16px}
  .bubble{max-width:92%}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <h1>Store help</h1>
      <p>Answers come straight from our FAQ. Pick a topic or type your own question.</p>
    </div>
    <button class="menu" id="menu" type="button" aria-expanded="false">Topics</button>
    <nav class="topics" id="topics" aria-label="Help topics"></nav>
    <div class="side-actions">
      <button id="export" type="button">Export chat log</button>
      <button id="clear" type="button">Clear chat</button>
    </div>
  </aside>
  <section class="chat">
    <div class="bar"><strong>Ask a question</strong><span>Answers are matched to our FAQ</span></div>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" placeholder="Type your question, e.g. where is my order?" aria-label="Your question" maxlength="300">
      <button class="send" type="submit">Send</button>
    </form>
    <p class="note">Chats are saved only in this browser. Export the log to see which questions went unanswered.</p>
  </section>
</div>

<!-- ============ CORE: FAQ data + matching (no DOM) ============ -->
<script id="core">
const FAQS = [
 {q:"How can I track my order?",alt:["order status","where is my order","track my package","when will my order arrive"],a:"Go to 'My Orders' in your account and click 'Track Package'. You'll also receive a tracking link by email once your order ships."},
 {q:"What is your return policy?",exact:true,alt:["can I send an item back","how do returns work","exchange or return an item","return window"],a:"You can return most items within 30 days of delivery for a full refund, as long as they are unused and in their original packaging."},
 {q:"How long does shipping take?",alt:["delivery time","how many days for delivery","when will it be delivered","shipping speed"],a:"Standard shipping takes 3-7 business days. Express shipping takes 1-2 business days."},
 {q:"Do you ship internationally?",alt:["deliver abroad","shipping to other countries","overseas delivery","do you ship outside the country"],a:"Yes! We ship to over 50 countries. International delivery usually takes 7-14 business days."},
 {q:"What payment methods do you accept?",alt:["how can I pay","do you take PayPal","accepted credit cards","can I pay with Apple Pay"],a:"We accept Visa, Mastercard, American Express, PayPal, Apple Pay, and Google Pay."},
 {q:"How do I cancel my order?",alt:["cancel a purchase","I changed my mind about my order","stop my order"],a:"Orders can be cancelled within 1 hour of purchase from the 'My Orders' page. After that, please contact support."},
 {q:"How do I reset my password?",alt:["forgot my password","I can't log in","change my password","locked out of my account"],a:"Click 'Forgot Password' on the login page and enter your email. We'll send you a link to create a new password."},
 {q:"How can I contact customer support?",alt:["talk to a human","customer service phone or email","speak to an agent","support hours"],a:"Email support@example.com or use live chat, available 9am-6pm, Monday to Friday."},
 {q:"Can I change my shipping address after ordering?",alt:["update delivery address","wrong address on my order","edit address"],a:"Yes, if your order hasn't shipped yet. Go to 'My Orders' and select 'Edit Address', or contact support right away."},
 {q:"Do you offer gift cards?",alt:["buy a gift card","gift voucher","present for a friend card"],a:"Yes, digital gift cards from $10 to $500 are available and delivered instantly by email."},
 {q:"How do I get a refund?",exact:true,alt:["I want my money back","when will I be refunded","refund time","how long do refunds take"],a:"Refunds are issued to your original payment method within 5-7 business days after we receive your returned item."},
 {q:"Is my personal information secure?",exact:true,alt:["is my data safe","privacy policy","do you share my data","is my card information protected"],a:"Yes. We use SSL encryption and never sell or share your personal data with third parties."}
];
const THRESHOLD = 0.20;
const FALLBACK = "Sorry, I couldn't find an answer to that. Try rephrasing, or contact support@example.com.";

const STOP = new Set("a an the is are was were be been do does did can could will would should i me my we our you your it its this that these those of to in on at for with from by as and or but if so than then there here what which who whom how why about into over after before not no yes please".split(" "));
const SYN = {parcel:"order",package:"order",shipment:"order",purchase:"order",deliver:"ship",delivery:"ship",delivered:"ship",
  abroad:"international",overseas:"international",worldwide:"international",money:"refund",reimburse:"refund",reimbursement:"refund",
  voucher:"gift",agent:"support",human:"support"};

function stem(w){
  if(w.endsWith("ies")&&w.length>4) return w.slice(0,-3)+"y";
  for(const suf of ["ing","ed"]){
    if(w.endsWith(suf)&&w.length>suf.length+3){ w=w.slice(0,-suf.length); if(/([^aeiou])\1$/.test(w)) w=w.slice(0,-1); return w; }
  }
  if(w.endsWith("s")&&!w.endsWith("ss")&&w.length>3) return w.slice(0,-1);
  return w;
}
function preprocess(text){
  return text.toLowerCase().replace(/[^a-z0-9\s']/g," ").replace(/'/g,"").split(/\s+/)
    .filter(t=>t&&!STOP.has(t)).map(t=>stem(SYN[t]||t));
}

// TF-IDF over: question (x2) + alternative wordings + answer
const docs = FAQS.map(f=>preprocess([f.q,f.q,...f.alt,f.a].join(" ")));
const df = {};
docs.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));
const N = docs.length;
const idf = t=>Math.log((1+N)/(1+(df[t]||0)))+1;
function vec(tokens){
  const tf={}; tokens.forEach(t=>tf[t]=(tf[t]||0)+1);
  const v={}; let norm=0;
  for(const t in tf){ if(df[t]===undefined) continue; v[t]=tf[t]*idf(t); norm+=v[t]*v[t]; }
  norm=Math.sqrt(norm)||1; for(const t in v) v[t]/=norm;
  return v;
}
const docVecs = docs.map(vec);
const cosine=(a,b)=>{let s=0; for(const t in a) if(b[t]) s+=a[t]*b[t]; return s;};

function single(question){
  const qv = vec(preprocess(question));
  let best=-1, score=0;
  docVecs.forEach((dv,i)=>{ const s=cosine(qv,dv); if(s>score){score=s;best=i;} });
  if(best<0||score<THRESHOLD) return {answer:FALLBACK,matched:null,score};
  return {answer:FAQS[best].a,matched:FAQS[best].q,score};
}
function splitQuestions(text,max=3){
  const parts=[];
  text.trim().split(/\?+|;/).map(s=>s.trim()).filter(Boolean).forEach(chunk=>{
    const sub=chunk.split(/\s+(?:and|also|plus)\s+/i);
    if(sub.length>1&&sub.every(s=>s.split(/\s+/).length>=3)) parts.push(...sub); else parts.push(chunk);
  });
  return parts.slice(0,max).length?parts.slice(0,max):[text];
}
function getResponse(text){
  if(!text.trim()) return {answer:"Please type a question so I can help.",matched:null,score:0};
  const parts=splitQuestions(text);
  if(parts.length===1) return single(parts[0]);
  const lines=[],matched=[],seen=new Set(); let best=0;
  parts.forEach(p=>{
    const r=single(p), label=p[0].toUpperCase()+p.slice(1)+"?";
    if(!r.matched) lines.push(`**${label}**\nI couldn't find an answer to that one. Please contact support@example.com.`);
    else if(!seen.has(r.matched)){ seen.add(r.matched); matched.push(r.matched); best=Math.max(best,r.score); lines.push(`**${label}**\n${r.answer}`); }
  });
  return matched.length?{answer:lines.join("\n\n"),matched:matched.join(" | "),score:best}:{answer:FALLBACK,matched:null,score:0};
}
</script>

<!-- ============ UI ============ -->
<script id="ui">
(function(){
  const $=id=>document.getElementById(id);
  const logEl=$("log"), form=$("form"), input=$("q");
  const KEY="faq_chat_log"; let store=[];
  try{ store=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store.slice(-500))); }catch(e){} };
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
  const el=(tag,cls,html)=>{const n=document.createElement(tag); if(cls)n.className=cls; if(html!==undefined)n.innerHTML=html; return n;};
  const down=()=>{ logEl.scrollTop=logEl.scrollHeight; };

  function userRow(text){ const r=el("div","row me"); r.appendChild(el("div","bubble",md(text))); logEl.appendChild(r); down(); }
  function botRow(text,meta){
    const r=el("div","row bot"); r.appendChild(el("div","av","S"));
    const b=el("div","bubble",md(text));
    if(meta){
      const s=el("div","src");
      const pct=Math.round(Math.min(meta.score,1)*100);
      s.appendChild(el("span","t",meta.matched?`Matched FAQ: ${esc(meta.matched)}`:"No matching FAQ found"));
      if(meta.matched) s.appendChild(el("div","meter",`<i style="width:${pct}%"></i>`));
      const fb=el("div","fb"); fb.appendChild(el("span","",meta.matched?`Match ${pct}% · Was this helpful?`:"Was this helpful?"));
      const up=el("button","","Yes"), no=el("button","","No"); up.type=no.type="button";
      const rate=v=>{ const e=store.find(x=>x.id===meta.id); if(e){e.rating=v;save();}
        up.disabled=no.disabled=true; (v==="up"?up:no).classList.add("on"); };
      up.onclick=()=>rate("up"); no.onclick=()=>rate("down");
      fb.append(up,no); s.appendChild(fb); b.appendChild(s);
    }
    r.appendChild(b); logEl.appendChild(r); down(); return r;
  }
  const greet=()=>botRow("Hi! I can help with orders, shipping, returns, payments and your account. What would you like to know?");

  function ask(text){
    text=text.trim(); if(!text) return;
    userRow(text); input.value="";
    const typing=botRow("").querySelector(".bubble"); typing.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
    setTimeout(()=>{
      typing.closest(".row").remove();
      const r=getResponse(text), id=Math.random().toString(36).slice(2,10);
      store.push({id,time:new Date().toISOString(),question:text,answer:r.answer,matched:r.matched||"",score:r.score.toFixed(3),answered:r.matched?"yes":"no",rating:""});
      save(); botRow(r.answer,{...r,id});
    },350);
  }
  form.addEventListener("submit",e=>{ e.preventDefault(); ask(input.value); });

  const TOPICS={
    "Orders":["How can I track my order?","How do I cancel my order?","Can I change my shipping address after ordering?"],
    "Shipping and returns":["How long does shipping take?","Do you ship internationally?","What is your return policy?","How do I get a refund?"],
    "Payments and gift cards":["What payment methods do you accept?","Do you offer gift cards?"],
    "Account and support":["How do I reset my password?","How can I contact customer support?","Is my personal information secure?"]
  };
  const nav=$("topics");
  Object.entries(TOPICS).forEach(([name,qs])=>{
    const g=el("div","topic"); g.appendChild(el("h2","",name));
    qs.forEach(q=>{ const b=el("button","",esc(q)); b.type="button";
      b.onclick=()=>{ $("side").classList.remove("open"); $("menu").setAttribute("aria-expanded","false"); ask(q); }; g.appendChild(b); });
    nav.appendChild(g);
  });
  $("menu").onclick=()=>{ const o=$("side").classList.toggle("open"); $("menu").setAttribute("aria-expanded",o); };

  $("clear").onclick=()=>{ logEl.innerHTML=""; greet(); };
  $("export").onclick=()=>{
    if(!store.length){ alert("No chats to export yet."); return; }
    const cols=["id","time","question","answer","matched","score","answered","rating"];
    const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv=[cols.join(","),...store.map(r=>cols.map(c=>cell(r[c])).join(","))].join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="chat_log.csv"; a.click();
  };
  greet();
})();
</script>
</body>
</html>
